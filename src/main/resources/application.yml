server:
  port: 8000
  tomcat:
    threads:
      max: 200
  address: 0.0.0.0

spring:
  application:
    name: cloudsphere-netdisk

  profiles:
    active: home

  servlet:
    multipart:
      enabled: true
      max-file-size: 5000MB
      max-request-size: 5000MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

cloudsphere:
  jwt:
    secret: cloudsphere_super_secure_random_key_for_jwt_token_generation_2026
    expiration: 86400